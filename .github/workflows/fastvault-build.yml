name: FastVault Android build

on:
  push:
    branches: [fastvault]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply FastVault rebrand overlay
        run: node fastvault/apply.mjs

      - name: Run unit tests
        run: ./gradlew testStandardDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleStandardDebug

      - name: Locate the built APK
        id: apk
        shell: bash
        run: |
          apk_path=$(find app/build/outputs/apk/standard/debug -name "*.apk" | head -n1)
          if [ -z "$apk_path" ]; then
            echo "::error::no APK found under app/build/outputs/apk/standard/debug"
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fastvault-android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
